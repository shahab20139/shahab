<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چت‌روم</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

  * { box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; margin: 0; padding: 0; }
  
  :root {
    --bg-dark: #0a0e1a;
    --bg-card: #131a2b;
    --bg-input: #1c2438;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --pink: #ec4899;
    --green: #10b981;
    --red: #ef4444;
    --gold: #f59e0b;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
  }

  body {
    background: radial-gradient(ellipse at top, #1e1b4b 0%, #0a0e1a 60%);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(99,102,241,0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(236,72,153,0.12) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .hidden { display: none !important; }

  /* ===== Auth ===== */
  #authPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  .auth-card {
    background: rgba(19, 26, 43, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(99,102,241,0.25);
    border-radius: 24px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(99,102,241,0.1);
    animation: slideUp 0.5s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .auth-logo {
    text-align: center;
    font-size: 42px;
    margin-bottom: 8px;
  }

  .auth-title {
    text-align: center;
    font-size: 24px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }

  .auth-sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
  }

  /* Tabs */
  .auth-tabs {
    display: flex;
    background: var(--bg-input);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }

  .auth-tabs button {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
  }

  .auth-tabs button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 4px 12px rgba(99,102,241,0.4);
  }

  /* Inputs */
  .field { margin-bottom: 12px; position: relative; }

  .field input, .field textarea, .field select {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-input);
    border: 1.5px solid transparent;
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s;
    outline: none;
  }

  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
  }

  .field input::placeholder, .field textarea::placeholder { color: #64748b; }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    color: #fff;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 20px rgba(99,102,241,0.4);
  }

  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(99,102,241,0.5); }

  .btn-ghost {
    background: var(--bg-input);
    color: var(--text);
    border: 1.5px solid rgba(99,102,241,0.2);
  }

  .btn-ghost:hover { border-color: var(--accent); }

  .btn-sm { width: auto; padding: 8px 14px; font-size: 12px; }
  .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .btn-success { background: linear-gradient(135deg, #10b981, #059669); }

  .auth-msg {
    text-align: center;
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
    color: var(--red);
    font-weight: 600;
  }

  /* ===== Chat Layout ===== */
  #chatPage {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 16px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px;
    height: 100vh;
    position: relative;
    z-index: 1;
  }

  @media (max-width: 900px) {
    #chatPage { grid-template-columns: 1fr; height: auto; }
  }

  /* Top bar */
  .topbar {
    grid-column: 1 / -1;
    background: rgba(19, 26, 43, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 18px;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .user-info { display: flex; align-items: center; gap: 10px; }

  .avatar {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 18px; color: #fff;
    box-shadow: 0 4px 12px rgba(99,102,241,0.4);
  }

  .user-name { font-weight: 700; font-size: 15px; }
  .user-meta { display: flex; gap: 6px; align-items: center; margin-top: 2px; }

  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Rank badges */
  .rank {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.3px;
  }
  .rank.admin    { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 0 12px rgba(239,68,68,0.5); }
  .rank.streamer { background: linear-gradient(135deg, #a855f7, #7c3aed); box-shadow: 0 0 12px rgba(168,85,247,0.5); }
  .rank.vip      { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 12px rgba(16,185,129,0.5); }
  .rank.gold     { background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 0 12px rgba(251,191,36,0.5); color: #422006; }
  .rank.member   { background: linear-gradient(135deg, #64748b, #475569); }

  /* ===== Chat panel ===== */
  .chat-panel {
    background: rgba(19, 26, 43, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: calc(100vh - 100px);
  }

  @media (max-width: 900px) {
    .chat-panel { height: 70vh; }
  }

  .panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(99,102,241,0.15);
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
  }

  .panel-header .icon {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .panel-header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    margin-right: auto;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }

  .chat-box::-webkit-scrollbar { width: 6px; }
  .chat-box::-webkit-scrollbar-track { background: transparent; }
  .chat-box::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 3px; }
  .chat-box::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.6); }

  /* Message bubble */
  .msg-row {
    display: flex;
    flex-direction: column;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.own { align-items: flex-start; }
  .msg-row.other { align-items: flex-end; }

  .msg-head {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 4px;
    padding: 0 4px;
    font-size: 12px;
  }

  .msg-head .name { font-weight: 800; color: #c7d2fe; }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    position: relative;
  }

  .msg-row.own .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-bottom-right-radius: 4px;
    color: #fff;
    box-shadow: 0 4px 15px rgba(99,102,241,0.3);
  }

  .msg-row.other .bubble {
    background: var(--bg-input);
    border: 1px solid rgba(99,102,241,0.15);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg-actions {
    display: flex;
    gap: 4px;
    margin-top: 6px;
    padding: 0 4px;
  }

  .msg-actions button {
    padding: 3px 10px;
    font-size: 11px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    background: rgba(239,68,68,0.15);
    color: #fca5a5;
    transition: 0.2s;
  }

  .msg-actions button:hover { background: rgba(239,68,68,0.3); }

  /* Input */
  .chat-input-area {
    padding: 12px 16px;
    border-top: 1px solid rgba(99,102,241,0.15);
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .chat-input-area textarea {
    flex: 1;
    padding: 12px 16px;
    background: var(--bg-input);
    border: 1.5px solid transparent;
    border-radius: 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    resize: none;
    outline: none;
    max-height: 120px;
    transition: 0.2s;
  }

  .chat-input-area textarea:focus { border-color: var(--accent); }

  .send-btn {
    width: 46px; height: 46px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    transition: 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { transform: scale(1.05); }

  /* ===== Announce panel ===== */
  .announce-panel {
    background: rgba(19, 26, 43, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(236,72,153,0.25);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: calc(100vh - 100px);
    box-shadow: 0 0 40px rgba(236,72,153,0.08);
  }

  @media (max-width: 900px) {
    .announce-panel { height: auto; max-height: 60vh; }
  }

  .announce-panel .panel-header {
    border-bottom-color: rgba(236,72,153,0.2);
  }

  .announce-panel .panel-header .icon {
    background: linear-gradient(135deg, var(--pink), #db2777);
    box-shadow: 0 0 15px rgba(236,72,153,0.4);
  }

  .announce-list {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .announce-list::-webkit-scrollbar { width: 6px; }
  .announce-list::-webkit-scrollbar-thumb { background: rgba(236,72,153,0.3); border-radius: 3px; }

  .announce-item {
    background: linear-gradient(135deg, rgba(236,72,153,0.1), rgba(139,92,246,0.08));
    border: 1px solid rgba(236,72,153,0.2);
    border-right: 3px solid var(--pink);
    border-radius: 14px;
    padding: 14px;
    animation: msgIn 0.4s ease;
    position: relative;
  }

  .announce-item .a-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 12px;
  }

  .announce-item .a-head .name { font-weight: 800; color: #f9a8d4; }

  .announce-item .a-body {
    font-size: 13.5px;
    line-height: 1.7;
    color: #e2e8f0;
  }

  .announce-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 30px 10px;
  }

  .announce-empty .big { font-size: 40px; display: block; margin-bottom: 8px; opacity: 0.5; }

  .announce-input {
    padding: 12px 16px;
    border-top: 1px solid rgba(236,72,153,0.2);
    display: flex;
    gap: 8px;
  }

  .announce-input textarea {
    flex: 1;
    padding: 10px 12px;
    background: var(--bg-input);
    border: 1.5px solid transparent;
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    resize: none;
    outline: none;
    transition: 0.2s;
  }

  .announce-input textarea:focus { border-color: var(--pink); }

  /* ===== Panels (Admin/Super) ===== */
  .fullscreen-panel {
    position: fixed;
    inset: 0;
    background: var(--bg-dark);
    z-index: 100;
    overflow-y: auto;
    padding: 20px;
  }

  .fullscreen-panel::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(99,102,241,0.15) 0%, transparent 50%);
    pointer-events: none;
  }

  .panel-container {
    max-width: 1000px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .panel-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 16px 20px;
    background: rgba(19,26,43,0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 18px;
  }

  .panel-top h2 {
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .panel-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .panel-tabs button {
    padding: 9px 16px;
    border-radius: 12px;
    border: 1.5px solid rgba(99,102,241,0.2);
    background: rgba(19,26,43,0.7);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }

  .panel-tabs button:hover { border-color: var(--accent); color: var(--text); }
  .panel-tabs button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(99,102,241,0.4);
  }

  .user-row, .ban-row, .rank-row {
    background: rgba(19,26,43,0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(99,102,241,0.15);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    transition: 0.2s;
  }

  .user-row:hover, .ban-row:hover { border-color: rgba(99,102,241,0.4); }

  .row-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  .row-name { font-weight: 800; font-size: 15px; }
  .row-info { font-size: 12.5px; color: var(--text-dim); margin: 3px 0; }
  .row-info b { color: #ffd369; font-family: monospace; }

  .row-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .row-actions button {
    padding: 6px 12px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    color: #fff;
  }

  .row-actions .b-sec { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
  .row-actions .b-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .row-actions .b-green { background: linear-gradient(135deg, #10b981, #059669); }
  .row-actions .b-gold { background: linear-gradient(135deg, #f59e0b, #d97706); }

  .row-actions button:hover { transform: translateY(-2px); }

  .log-line {
    padding: 10px 14px;
    background: rgba(19,26,43,0.7);
    border-right: 3px solid var(--accent);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 12.5px;
    color: #cbd5e1;
    font-family: 'Vazirmatn', monospace;
  }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-dim);
  }

  .empty-state .big { font-size: 50px; display: block; margin-bottom: 12px; opacity: 0.4; }

  /* ===== Ban overlay ===== */
  .ban-overlay {
    position: fixed; inset: 0;
    background: rgba(10, 14, 26, 0.97);
    backdrop-filter: blur(10px);
    z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  .ban-box {
    background: rgba(19,26,43,0.95);
    border: 2px solid var(--red);
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 0 60px rgba(239,68,68,0.3);
    animation: slideUp 0.4s ease;
  }

  .ban-box .icon { font-size: 60px; margin-bottom: 12px; }
  .ban-box h2 { color: var(--red); margin-bottom: 16px; font-size: 22px; }
  .ban-box .reason { color: #fca5a5; margin-bottom: 12px; font-size: 15px; line-height: 1.7; }
  .ban-box .time { color: #fbbf24; font-weight: 800; font-size: 17px; margin-bottom: 20px; }

  /* Search */
  .search-box {
    width: 100%;
    padding: 12px 18px;
    background: rgba(19,26,43,0.7);
    border: 1.5px solid rgba(99,102,241,0.2);
    border-radius: 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    transition: 0.2s;
  }

  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: #64748b; }
</style>
</head>
<body>

<!-- ===== Ban Overlay ===== -->
<div id="banOverlay" class="ban-overlay hidden">
  <div class="ban-box">
    <div class="icon">🚫</div>
    <h2>حساب شما تعلیق شده است</h2>
    <p class="reason" id="banReason"></p>
    <p class="time" id="banTime"></p>
    <button class="btn btn-ghost btn-sm" style="width:auto;" onclick="logout()">خروج از حساب</button>
  </div>
</div>

<!-- ===== Auth Page ===== -->
<div id="authPage">
  <div class="auth-card">
    <div class="auth-logo">💬</div>
    <div class="auth-title">چت‌روم</div>
    <div class="auth-sub">به جمع ما خوش آمدی</div>

    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuth('login')">ورود</button>
      <button id="tabReg" onclick="switchAuth('reg')">ثبت‌نام</button>
    </div>

    <div id="loginForm">
      <div class="field"><input id="loginUser" placeholder="نام کاربری"></div>
      <div class="field"><input id="loginPass" type="password" placeholder="رمز عبور"></div>
      <button class="btn btn-primary" onclick="doLogin()">ورود به حساب</button>
    </div>

    <div id="regForm" class="hidden">
      <div class="field"><input id="regUser" placeholder="نام کاربری"></div>
      <div class="field"><input id="regPass" type="password" placeholder="رمز عبور"></div>
      <div class="field"><input id="regPass2" type="password" placeholder="تکرار رمز عبور"></div>
      <button class="btn btn-primary" onclick="doRegister()">ساخت حساب</button>
      <div style="font-size:11px;color:var(--text-dim);text-align:center;margin-top:10px;line-height:1.8;">
        رمز باید حداقل ۶ کاراکتر و شامل حروف کوچک، بزرگ و عدد باشد
      </div>
    </div>

    <div id="authMsg" class="auth-msg"></div>
  </div>
</div>

<!-- ===== Chat Page ===== -->
<div id="chatPage" class="hidden">

  <!-- Topbar -->
  <div class="topbar">
    <div class="user-info">
      <div class="avatar" id="myAvatar">?</div>
      <div>
        <div class="user-name" id="myName"></div>
        <div class="user-meta" id="myRank"></div>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="adminBtn" class="btn btn-ghost btn-sm hidden" onclick="openAdminPanel()">🛡️ پنل ادمین</button>
      <button id="superBtn" class="btn btn-danger btn-sm hidden" onclick="openSuperPanel()">👑 مدیریت کل</button>
      <button class="btn btn-ghost btn-sm" onclick="logout()">خروج</button>
    </div>
  </div>

  <!-- Chat Panel -->
  <div class="chat-panel">
    <div class="panel-header">
      <div class="icon">💬</div>
      <span>چت عمومی</span>
      <div class="dot"></div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input-area">
      <textarea id="msgInput" rows="1" placeholder="پیامت رو بنویس..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>

  <!-- Announce Panel -->
  <div class="announce-panel">
    <div class="panel-header">
      <div class="icon">📢</div>
      <span>اطلاع‌رسانی</span>
    </div>
    <div class="announce-list" id="announceBox"></div>
    <div class="announce-input hidden" id="announceInput">
      <textarea id="announceText" rows="2" placeholder="اطلاعیه‌ات رو بنویس..."></textarea>
      <button class="send-btn" onclick="sendAnnounce()">➤</button>
    </div>
  </div>

</div>

<!-- ===== Admin Panel ===== -->
<div id="adminPanel" class="fullscreen-panel hidden">
  <div class="panel-container">
    <div class="panel-top">
      <h2>🛡️ پنل ادمین</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeAdmin()">بازگشت</button>
    </div>
    <input class="search-box" id="adminSearch" placeholder="🔍 جستجوی نام کاربری..." oninput="renderAdminUsers()">
    <div id="adminUsersList"></div>
  </div>
</div>

<!-- ===== Super Panel ===== -->
<div id="superPanel" class="fullscreen-panel hidden">
  <div class="panel-container">
    <div class="panel-top">
      <h2>👑 پنل مدیریت کل</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeSuper()">بازگشت</button>
    </div>
    <div class="panel-tabs">
      <button id="stUsers" class="active" onclick="switchSuper('users')">کاربران</button>
      <button id="stBans" onclick="switchSuper('bans')">تعلیق‌ها</button>
      <button id="stRanks" onclick="switchSuper('ranks')">رنک‌ها</button>
      <button id="stServerLog" onclick="switchSuper('slog')">لاگ سرور</button>
      <button id="stAdminLog" onclick="switchSuper('alog')">لاگ ادمین‌ها</button>
      <button id="stRankLog" onclick="switchSuper('rlog')">لاگ رنک‌ها</button>
    </div>
    <div id="superContent"></div>
  </div>
</div>

<script>
/* ================== داده‌ها ================== */
const SUPER_USER = "shahab20001392";
const SUPER_PASS = "shahaB502619972013";

const RANKS = {
  admin:    { color: "admin",    label: "ادمین",   priority: 100 },
  streamer: { color: "streamer", label: "استریمر", priority: 300 },
  vip:      { color: "vip",      label: "VIP",     priority: 99  },
  gold:     { color: "gold",     label: "گلد",     priority: 98  },
  member:   { color: "member",   label: "عضو",     priority: 44  }
};

let DB = JSON.parse(localStorage.getItem("chatDB") || "null");
if (!DB) {
  DB = { users: {}, messages: [], announces: [], serverLogs: [], adminLogs: [], rankLogs: [] };
  DB.users[SUPER_USER] = {
    password: SUPER_PASS, rank: "admin", rankExpire: null,
    isSuper: true, ban: null, createdAt: Date.now()
  };
  save();
}

function save(){ localStorage.setItem("chatDB", JSON.stringify(DB)); }
let currentUser = null;
let refreshTimer = null;

/* ================== ابزارها ================== */
function now(){ return Date.now(); }
function daysToMs(d){ return d * 24 * 60 * 60 * 1000; }

function addLog(type, text){
  DB[type].unshift({ time: now(), text, by: currentUser || "سیستم" });
  if (DB[type].length > 500) DB[type].pop();
  save();
}

function formatDuration(ms){
  if (ms <= 0) return "0";
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400);
  const h = Math.floor((s%86400)/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  let out = [];
  if (d) out.push(d + " روز");
  if (h) out.push(h + " ساعت");
  if (m) out.push(m + " دقیقه");
  if (sec && !d && !h) out.push(sec + " ثانیه");
  return out.join(" و ") || "0";
}

function isRankActive(u){ if(!u.rank) return false; if(u.rankExpire === null) return true; return u.rankExpire > now(); }
function getActiveRank(u){ if(!isRankActive(u)) return "member"; return u.rank; }
function isBanned(u){ if(!u.ban) return false; if(u.ban.permanent) return true; return u.ban.until > now(); }

function validatePass(p){
  if (p.length < 6) return "رمز باید حداقل ۶ کاراکتر باشد";
  if (!/[a-z]/.test(p)) return "رمز باید حروف کوچک انگلیسی داشته باشد";
  if (!/[A-Z]/.test(p)) return "رمز باید حروف بزرگ انگلیسی داشته باشد";
  if (!/[0-9]/.test(p)) return "رمز باید عدد داشته باشد";
  return null;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================== احراز هویت ================== */
function switchAuth(t){
  document.getElementById("tabLogin").classList.toggle("active", t==="login");
  document.getElementById("tabReg").classList.toggle("active", t==="reg");
  document.getElementById("loginForm").classList.toggle("hidden", t!=="login");
  document.getElementById("regForm").classList.toggle("hidden", t!=="reg");
  document.getElementById("authMsg").textContent = "";
}

function doRegister(){
  const u = document.getElementById("regUser").value.trim();
  const p = document.getElementById("regPass").value;
  const p2 = document.getElementById("regPass2").value;
  const msg = document.getElementById("authMsg");

  if (!u || !p) { msg.textContent = "همه فیلدها را پر کن"; return; }
  if (DB.users[u]) { msg.textContent = "این نام کاربری قبلاً ثبت شده! لطفاً وارد شو"; return; }
  if (p !== p2) { msg.textContent = "تکرار رمز مطابقت ندارد"; return; }
  const err = validatePass(p);
  if (err) { msg.textContent = err; return; }

  DB.users[u] = { password: p, rank: "member", rankExpire: null, isSuper: false, ban: null, createdAt: now() };
  save();
  addLog("serverLogs", `کاربر جدید ثبت‌نام کرد: ${u}`);
  addLog("rankLogs", `رنک member به ${u} داده شد`);
  msg.style.color = "#10b981";
  msg.textContent = "✓ ثبت‌نام موفق! حالا وارد شو";
}

function doLogin(){
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  const msg = document.getElementById("authMsg");
  const user = DB.users[u];
  if (!user || user.password !== p) {
    msg.style.color = "#ef4444";
    msg.textContent = "نام کاربری یا رمز اشتباه است";
    return;
  }
  if (isBanned(user)) { showBan(user); return; }
  currentUser = u;
  addLog("serverLogs", `${u} وارد سایت شد`);
  openChat();
}

function showBan(user){
  document.getElementById("banReason").textContent = "دلیل: " + user.ban.reason;
  const t = document.getElementById("banTime");
  if (user.ban.permanent) t.textContent = "⛔ تعلیق دائم";
  else {
    t.textContent = "⏳ زمان باقی‌مانده: " + formatDuration(user.ban.until - now());
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      if (!isBanned(user)) { clearInterval(refreshTimer); document.getElementById("banOverlay").classList.add("hidden"); return; }
      t.textContent = "⏳ زمان باقی‌مانده: " + formatDuration(user.ban.until - now());
    }, 1000);
  }
  document.getElementById("banOverlay").classList.remove("hidden");
}

function logout(){
  if (currentUser) addLog("serverLogs", `${currentUser} خارج شد`);
  currentUser = null;
  if (refreshTimer) clearInterval(refreshTimer);
  document.getElementById("banOverlay").classList.add("hidden");
  document.getElementById("authPage").classList.remove("hidden");
  document.getElementById("chatPage").classList.add("hidden");
  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("superPanel").classList.add("hidden");
}

/* ================== صفحه چت ================== */
function openChat(){
  document.getElementById("authPage").classList.add("hidden");
  document.getElementById("chatPage").classList.remove("hidden");

  const user = DB.users[currentUser];
  const rank = getActiveRank(user);
  const rankInfo = RANKS[rank];

  document.getElementById("myName").textContent = currentUser;
  document.getElementById("myAvatar").textContent = currentUser.charAt(0).toUpperCase();
  document.getElementById("myRank").innerHTML = `<span class="rank ${rankInfo.color}">${rankInfo.label}</span>`;

  document.getElementById("adminBtn").classList.toggle("hidden", rank !== "admin");
  document.getElementById("superBtn").classList.toggle("hidden", !user.isSuper);

  const canAnnounce = (rank === "admin" || rank === "streamer");
  document.getElementById("announceInput").classList.toggle("hidden", !canAnnounce);

  renderAnnounces();
  renderMessages();
  startAutoRefresh();
}

function startAutoRefresh(){
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    const me = DB.users[currentUser];
    if (me && isBanned(me)) { showBan(me); return; }
    renderMessages();
    renderAnnounces();
  }, 2000);
}

/* ================== اطلاع‌رسانی ================== */
function sendAnnounce(){
  const txt = document.getElementById("announceText").value.trim();
  if (!txt) return;
  const rank = getActiveRank(DB.users[currentUser]);
  DB.announces.unshift({ text: txt, by: currentUser, rank, time: now() });
  save();
  addLog("serverLogs", `${currentUser} اطلاعیه فرستاد: ${txt}`);
  document.getElementById("announceText").value = "";
  renderAnnounces();
}

function renderAnnounces(){
  const box = document.getElementById("announceBox");
  if (!DB.announces.length) {
    box.innerHTML = `<div class="announce-empty"><span class="big">📭</span>هنوز اطلاعیه‌ای ارسال نشده</div>`;
    return;
  }
  box.innerHTML = DB.announces.slice(0, 20).map(a => {
    const ri = RANKS[a.rank] || RANKS.member;
    return `<div class="announce-item">
      <div class="a-head">
        <span class="name">${escapeHtml(a.by)}</span>
        <span class="rank ${ri.color}">${ri.label}</span>
      </div>
      <div class="a-body">${escapeHtml(a.text)}</div>
    </div>`;
  }).join("");
}

/* ================== چت ================== */
function sendMsg(){
  const el = document.getElementById("msgInput");
  const txt = el.value.trim();
  if (!txt) return;
  const rank = getActiveRank(DB.users[currentUser]);
  DB.messages.push({
    id: "m" + now() + Math.random(),
    user: currentUser, rank, text: txt, time: now()
  });
  if (DB.messages.length > 300) DB.messages.shift();
  save();
  el.value = "";
  renderMessages();
}

function renderMessages(){
  const box = document.getElementById("chatBox");
  const user = DB.users[currentUser];
  const rank = getActiveRank(user);
  const canDelete = (rank === "admin");
  const canBan = (rank === "admin");

  box.innerHTML = DB.messages.map(m => {
    const ri = RANKS[m.rank] || RANKS.member;
    const own = m.user === currentUser;
    let actions = "";
    if (canDelete || (canBan && !own)) {
      const btns = [];
      if (canDelete) btns.push(`<button onclick="delMsg('${m.id}')">حذف</button>`);
      if (canBan && !own) btns.push(`<button onclick="quickBan('${m.user}')">تعلیق</button>`);
      if (btns.length) actions = `<div class="msg-actions">${btns.join("")}</div>`;
    }
    return `<div class="msg-row ${own?'own':'other'}">
      <div class="msg-head">
        <span class="name">${escapeHtml(m.user)}</span>
        <span class="rank ${ri.color}">${ri.label}</span>
      </div>
      <div class="bubble">${escapeHtml(m.text)}</div>
      ${actions}
    </div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
}

function delMsg(id){
  DB.messages = DB.messages.filter(m => m.id !== id);
  save();
  addLog("adminLogs", `${currentUser} یک پیام را حذف کرد`);
  renderMessages();
}

function quickBan(target){
  const reason = prompt("دلیل تعلیق:");
  if (!reason) return;
  const days = parseInt(prompt("مدت (روز) - بین 1 تا 30:", "1"));
  if (!days || days < 1 || days > 30) { alert("فقط بین 1 تا 30 روز"); return; }
  DB.users[target].ban = { reason, until: now() + daysToMs(days), permanent: false, by: currentUser };
  save();
  addLog("adminLogs", `${currentUser} ${target} را ${days} روز تعلیق کرد - دلیل: ${reason}`);
  renderMessages();
}

/* ================== پنل ادمین ================== */
function openAdminPanel(){
  document.getElementById("chatPage").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");
  renderAdminUsers();
}
function closeAdmin(){
  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("chatPage").classList.remove("hidden");
}

function renderAdminUsers(){
  const q = document.getElementById("adminSearch").value.trim().toLowerCase();
  const list = document.getElementById("adminUsersList");
  const entries = Object.entries(DB.users).filter(([u]) => u.toLowerCase().includes(q));
  if (!entries.length) {
    list.innerHTML = `<div class="empty-state"><span class="big">🔍</span>کاربری یافت نشد</div>`;
    return;
  }
  list.innerHTML = entries.map(([u, data]) => {
    const rank = getActiveRank(data);
    const ri = RANKS[rank];
    const banned = isBanned(data);
    let banInfo = "";
    if (banned) {
      banInfo = data.ban.permanent
        ? `<div class="row-info" style="color:#fca5a5;">⛔ تعلیق دائم — دلیل: ${escapeHtml(data.ban.reason)} — توسط: ${escapeHtml(data.ban.by||"?")}</div>`
        : `<div class="row-info" style="color:#fca5a5;">⏳ تعلیق تا ${formatDuration(data.ban.until-now())} — دلیل: ${escapeHtml(data.ban.reason)} — توسط: ${escapeHtml(data.ban.by||"?")}</div>`;
    }
    const canUnban = banned && data.ban.by === currentUser;
    return `<div class="user-row">
      <div class="row-head">
        <div class="row-name">${escapeHtml(u)} <span class="rank ${ri.color}">${ri.label}</span></div>
        <div style="font-size:12px;color:var(--text-dim);">${data.isSuper ? "👑 مدیر کل" : ""}</div>
      </div>
      ${banInfo}
      <div class="row-actions">
        ${!banned ? `<button class="b-red" onclick="adminBan('${u}')">تعلیق (1-30 روز)</button>` : ""}
        ${canUnban ? `<button class="b-green" onclick="adminUnban('${u}')">رفع تعلیق</button>` : ""}
      </div>
    </div>`;
  }).join("");
}

function adminBan(target){
  if (target === SUPER_USER) { alert("نمی‌توانی مدیر کل را تعلیق کنی"); return; }
  const reason = prompt("دلیل تعلیق:");
  if (!reason) return;
  const days = parseInt(prompt("مدت (روز) - بین 1 تا 30:", "1"));
  if (!days || days < 1 || days > 30) { alert("فقط بین 1 تا 30 روز"); return; }
  DB.users[target].ban = { reason, until: now() + daysToMs(days), permanent: false, by: currentUser };
  save();
  addLog("adminLogs", `${currentUser} ${target} را ${days} روز تعلیق کرد - دلیل: ${reason}`);
  renderAdminUsers();
}

function adminUnban(target){
  const u = DB.users[target];
  if (!u.ban || u.ban.by !== currentUser) { alert("فقط می‌توانی تعلیق‌هایی که خودت ایجاد کردی را برداری"); return; }
  u.ban = null; save();
  addLog("adminLogs", `${currentUser} تعلیق ${target} را برداشت`);
  renderAdminUsers();
}

/* ================== پنل مدیریت کل ================== */
function openSuperPanel(){
  document.getElementById("chatPage").classList.add("hidden");
  document.getElementById("superPanel").classList.remove("hidden");
  switchSuper("users");
}
function closeSuper(){
  document.getElementById("superPanel").classList.add("hidden");
  document.getElementById("chatPage").classList.remove("hidden");
}

let currentSuperTab = "users";
function switchSuper(tab){
  currentSuperTab = tab;
  document.getElementById("stUsers").classList.toggle("active", tab==="users");
  document.getElementById("stBans").classList.toggle("active", tab==="bans");
  document.getElementById("stRanks").classList.toggle("active", tab==="ranks");
  document.getElementById("stServerLog").classList.toggle("active", tab==="slog");
  document.getElementById("stAdminLog").classList.toggle("active", tab==="alog");
  document.getElementById("stRankLog").classList.toggle("active", tab==="rlog");
  renderSuper();
}

function renderSuper(){
  const box = document.getElementById("superContent");
  const tab = currentSuperTab;

  if (tab === "users"){
    box.innerHTML = Object.entries(DB.users).map(([u, d]) => {
      const rank = getActiveRank(d);
      const ri = RANKS[rank];
      return `<div class="user-row">
        <div class="row-head">
          <div class="row-name">${escapeHtml(u)} <span class="rank ${ri.color}">${ri.label}</span> ${d.isSuper?"👑":""}</div>
        </div>
        <div class="row-info">🔑 رمز: <b>${escapeHtml(d.password)}</b></div>
        <div class="row-info">تعلیق: ${isBanned(d) ? (d.ban.permanent?"دائم":"تا " + formatDuration(d.ban.until-now())) : "ندارد"}</div>
        <div class="row-actions">
          <button class="b-sec" onclick="superChangePass('${u}')">تغییر رمز</button>
          <button class="b-sec" onclick="superGiveRank('${u}')">دادن رنک</button>
          <button class="b-sec" onclick="superRemoveRank('${u}')">حذف رنک</button>
          ${!d.isSuper ? `<button class="b-red" onclick="superBan('${u}')">تعلیق</button>` : ""}
          ${isBanned(d) ? `<button class="b-green" onclick="superUnban('${u}')">رفع تعلیق</button>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  else if (tab === "bans"){
    const banned = Object.entries(DB.users).filter(([u,d]) => isBanned(d));
    if (!banned.length) { box.innerHTML = `<div class="empty-state"><span class="big">✨</span>هیچ کاربری تعلیق نیست</div>`; return; }
    box.innerHTML = banned.map(([u,d]) => {
      const b = d.ban;
      const t = b.permanent ? "دائم" : formatDuration(b.until - now());
      return `<div class="ban-row">
        <div class="row-head"><div class="row-name">${escapeHtml(u)}</div></div>
        <div class="row-info">📝 دلیل: ${escapeHtml(b.reason)}</div>
        <div class="row-info">⏳ مدت: ${t}</div>
        <div class="row-info">👤 توسط: ${escapeHtml(b.by||"?")}</div>
        <div class="row-actions"><button class="b-green" onclick="superUnban('${u}')">رفع تعلیق</button></div>
      </div>`;
    }).join("");
  }

  else if (tab === "ranks"){
    const ranked = Object.entries(DB.users).filter(([u,d]) => getActiveRank(d) !== "member");
    if (!ranked.length) { box.innerHTML = `<div class="empty-state"><span class="big">🏅</span>هیچ کاربری رنک ویژه ندارد</div>`; return; }
    box.innerHTML = ranked.map(([u,d]) => {
      const rank = getActiveRank(d);
      const ri = RANKS[rank];
      const exp = d.rankExpire === null ? "دائم" : formatDuration(d.rankExpire - now());
      return `<div class="rank-row">
        <div class="row-head"><div class="row-name">${escapeHtml(u)} <span class="rank ${ri.color}">${ri.label}</span></div></div>
        <div class="row-info">⏰ انقضا: ${exp}</div>
        <div class="row-actions"><button class="b-red" onclick="superRemoveRank('${u}')">حذف رنک</button></div>
      </div>`;
    }).join("");
  }

  else if (tab === "slog") box.innerHTML = renderLogs(DB.serverLogs, "لاگ سرور خالی است");
  else if (tab === "alog") box.innerHTML = renderLogs(DB.adminLogs, "لاگ ادمین‌ها خالی است");
  else if (tab === "rlog") box.innerHTML = renderLogs(DB.rankLogs, "لاگ رنک‌ها خالی است");
}

function renderLogs(arr, emptyTxt){
  if (!arr.length) return `<div class="empty-state"><span class="big">📋</span>${emptyTxt}</div>`;
  return arr.slice(0, 150).map(l =>
    `<div class="log-line">[${new Date(l.time).toLocaleString("fa-IR")}] ${escapeHtml(l.text)}</div>`
  ).join("");
}

function superChangePass(target){
  const np = prompt("رمز جدید برای " + target + ":");
  if (!np) return;
  const err = validatePass(np);
  if (err) { alert(err); return; }
  DB.users[target].password = np; save();
  addLog("adminLogs", `${currentUser} رمز ${target} را تغییر داد`);
  renderSuper();
}

function superGiveRank(target){
  const rank = prompt("رنک (admin / streamer / vip / gold):");
  if (!RANKS[rank]) { alert("رنک نامعتبر"); return; }
  const days = prompt("مدت (روز، 1-365) یا 'd' برای دائم:");
  let expire = null;
  if (days !== "d") {
    const n = parseInt(days);
    if (!n || n < 1 || n > 365) { alert("بین 1 تا 365 یا d"); return; }
    expire = now() + daysToMs(n);
  }
  DB.users[target].rank = rank;
  DB.users[target].rankExpire = expire;
  save();
  addLog("rankLogs", `${currentUser} رنک ${rank} به ${target} داد (${expire?formatDuration(expire-now()):"دائم"})`);
  renderSuper();
}

function superRemoveRank(target){
  if (DB.users[target].isSuper) { alert("رنک مدیر کل قابل حذف نیست"); return; }
  DB.users[target].rank = "member";
  DB.users[target].rankExpire = null;
  save();
  addLog("rankLogs", `${currentUser} رنک ${target} را حذف کرد`);
  renderSuper();
}

function superBan(target){
  if (DB.users[target].isSuper) { alert("مدیر کل را نمی‌توان تعلیق کرد"); return; }
  const reason = prompt("دلیل تعلیق:");
  if (!reason) return;
  const mode = prompt("مدت (روز 1-365) یا 'perm' برای دائم:");
  let ban;
  if (mode === "perm") {
    ban = { reason, permanent: true, until: null, by: currentUser };
  } else {
    const n = parseInt(mode);
    if (!n || n < 1 || n > 365) { alert("بین 1 تا 365 یا perm"); return; }
    ban = { reason, permanent: false, until: now() + daysToMs(n), by: currentUser };
  }
  DB.users[target].ban = ban; save();
  addLog("adminLogs", `${currentUser} ${target} را تعلیق کرد - دلیل: ${reason} - ${ban.permanent?"دائم":formatDuration(ban.until-now())}`);
  renderSuper();
}

function superUnban(target){
  DB.users[target].ban = null; save();
  addLog("adminLogs", `${currentUser} تعلیق ${target} را برداشت`);
  renderSuper();
}
</script>
